<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah's Ark</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #f5f7fa;
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
}

.filter-btn {
    padding: 10px 15px;
    border: none;
    background: #3498db;
    color: white;
    cursor: pointer;
    border-radius: 4px;
}

.filter-btn.active {
    background: #2c3e50;
}

.hierarchy-container {
    background: white;
    padding: 30px;
    border-radius: 8px;
}

.org-chart {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.level {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin: 20px 0;
}

.node {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    width: 220px;
    text-align: center;
    position: relative;
}

/* connector line ABOVE node */
.node::before {
    content: '';
    position: absolute;
    top: -15px;
    left: 50%;
    width: 2px;
    height: 15px;
    background: #ccc;
    transform: translateX(-50%);
}

/* remove top line from first level */
.level:first-child .node::before {
    display: none;
}

/* vertical connector to children */
.connector {
    width: 2px;
    height: 20px;
    background: #ccc;
    margin: 0 auto;
}

.node h3 {
    font-size: 16px;
    border-bottom: 2px solid #3498db;
    padding-bottom: 5px;
}

.node p {
    font-size: 14px;
    margin: 5px 0;
}

.area {
    font-size: 12px;
    color: #e74c3c;
}

</style>
</head>

<body>

<div class="container">

<div class="controls">
<button class="filter-btn active" data-filter="all">All Positions</button>
<button class="filter-btn" data-filter="ZINARA Board Member">ZINARA Board Member</button>
</div>

<div class="hierarchy-container">
<div id="orgChart" class="org-chart"></div>
</div>

</div>

<script>

const data = [
{ Name: "Person 1", Position: "ZINARA Board Member", Area: "Area A" },
{ Name: "Person 2", Position: "ZINARA CEO", Area: "Area B" },
{ Name: "Person 3", Position: "ZINARA Director", Area: "Area C" },
{ Name: "Person 4", Position: "ZINARA Manager", Area: "Area D" }
];

const hierarchyStructure = {
'ZINARA Board Member': null,
'ZINARA CEO': 'ZINARA Board Member',
'ZINARA Director': 'ZINARA CEO',
'ZINARA Manager': 'ZINARA Director'
};

function buildHierarchy(data) {
    const map = {};
    const roots = [];

    data.forEach(item => {
        map[item.Name] = {
            ...item,
            children: [],
            reportsTo: hierarchyStructure[item.Position]
        };
    });

    data.forEach(item => {
        const node = map[item.Name];

        if (node.reportsTo) {
            const parent = Object.values(map).find(
                n => n.Position === node.reportsTo
            );
            if (parent) parent.children.push(node);
            else roots.push(node);
        } else {
            roots.push(node);
        }
    });

    return roots;
}

function renderOrgChart(data, container) {

    function createLevel(nodes, parentContainer) {

        const levelDiv = document.createElement('div');
        levelDiv.className = 'level';

        nodes.forEach(node => {

            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'node';
            nodeDiv.dataset.position = node.Position;

            nodeDiv.innerHTML = `
                <h3>${node.Position}</h3>
                <p>${node.Name}</p>
                <div class="area">${node.Area}</div>
            `;

            levelDiv.appendChild(nodeDiv);

            if (node.children.length > 0) {

                const connector = document.createElement('div');
                connector.className = 'connector';
                nodeDiv.appendChild(connector);

                const childContainer = document.createElement('div');
                nodeDiv.appendChild(childContainer);

                createLevel(node.children, childContainer);
            }

        });

        parentContainer.appendChild(levelDiv);
    }

    createLevel(data, container);
}

function filterByPosition(position) {
    const nodes = document.querySelectorAll('.node');

    nodes.forEach(node => {
        if (position === 'all' || node.dataset.position === position) {
            node.style.display = 'block';
        } else {
            node.style.display = 'none';
        }
    });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function () {

        document.querySelectorAll('.filter-btn')
            .forEach(b => b.classList.remove('active'));

        this.classList.add('active');
        filterByPosition(this.dataset.filter);
    });
});

const hierarchy = buildHierarchy(data);
renderOrgChart(hierarchy, document.getElementById('orgChart'));

</script>

</body>
</html>
